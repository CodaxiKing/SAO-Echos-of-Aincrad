name: AincradBosses
version: '${version}'
main: com.aincrad.bosses.AincradBossesPlugin
api-version: '1.21'
description: Chefes de andar do Aincrad — sala, fases, habilidades, Last Attack e labirinto.
authors: [CodaxiKing]
depend: [AincradCore, AincradFloors]
# Ordem de carga da rede Aincrad (o Paper recusa dependências em círculo): Core, Effects, UI,
# RPG, Economy, Floors, Bosses, Items, Life, Reputation, Duels, Social, Skills, Quests, World,
# Admin. Um plugin só lista aqui os que vêm ANTES dele; os que vêm depois são achados em tempo
# de execução. O teste LoadOrderTest do aincrad-core confere.
softdepend: [AincradRPG, AincradEconomy, MythicMobs]

commands:
  chefe:
    description: Guia de estratégia dos chefes (o que o servidor já descobriu).
    usage: /chefe guia <id> | informante | comprar <id> <fase> | pagina <id> <fase>
    aliases: [boss]
    permission: aincrad.bosses.guia
  raid:
    description: Quadro de raid — marcar, entrar, sair, cancelar.
    usage: /raid [criar <chefe> <dd/MM> <HH:mm> [tanques] [danos] [suportes] | entrar <n> <funcao> | sair <n> | cancelar <n>]
    aliases: [raids]
    permission: aincrad.bosses.raid

permissions:
  aincrad.bosses.guia:
    description: /chefe guia.
    default: true
  aincrad.bosses.raid:
    description: /raid.
    default: true
  aincrad.admin:
    description: Comandos de administração do Aincrad (/aincrad chefe, /aincrad labirinto) e entrar numa sala em luta.
    default: op
