# ============================================================
#  AincradBosses — configuração
#  Chefes: pasta bosses/ (um ou mais por arquivo)
#  Salas (salas.yml) e zonas do labirinto (labirinto.yml) são criadas pelos comandos.
# ============================================================

sala:
  # Segundos entre o primeiro jogador pisar na sala e a porta fechar (para o grupo entrar junto).
  espera_segundos: 10
  # Bloco que tapa o vão da porta durante a luta. BARRIER fica invisível.
  porta_material: IRON_BARS
  # Depois de uma derrota dos jogadores (ou do tempo acabar), o chefe só volta após este tempo.
  recarga_derrota_segundos: 60

abuso:
  # Lutador sem andar nem acertar o chefe por este tempo não recebe recompensa nem conta como
  # participante (volta a contar se se mexer antes do fim). 0 = desligado.
  ausente_segundos: 60

raid:
  # Só os inscritos entram na sala enquanto a raid estiver marcada (do aviso até o fim da duração).
  reservar_sala: true
  # Aviso aos inscritos, e começo da reserva da sala, este tempo antes da hora.
  aviso_minutos_antes: 15
  # Quanto tempo depois da hora a raid ainda vale (depois some do quadro).
  duracao_minutos: 60
  # Raids marcadas ao mesmo tempo por jogador.
  max_por_jogador: 2

# Padrões das zonas novas do labirinto (cada zona pode ser ajustada em labirinto.yml).
labirinto:
  mobs: [ZOMBIE, SKELETON, SPIDER]
  # Máximo de mobs vivos por zona.
  limite: 6
  # Segundos entre um nascimento e outro, por zona.
  intervalo_segundos: 8

# Informantes: o guia de estratégia (/chefe guia) é vendido em páginas, uma por fase.
# Quem estava na luta quando a fase apareceu ganha a página; os outros compram.
informantes:
  # false = o guia volta a ser aberto a todos.
  ativo: true
  # /chefe informante e /chefe comprar só funcionam em zona segura (cidade).
  so_na_cidade: true
  # Preço em Col de uma página: base + por andar acima do primeiro + por fase depois da primeira.
  # Sem o AincradEconomy as páginas saem de graça.
  preco_base: 200
  preco_por_andar: 50
  preco_por_fase: 100
  # /chefe pagina copia uma página sua num item (gasta 1 papel) para vender a outro jogador.
  # A cópia custa esta fração do preço da página.
  taxa_de_copia: 0.25

# Reunião de estratégia: /raid reuniao <n>, pelo líder, antes da raid.
reuniao:
  # Só pode ser convocada em zona segura (cidade).
  so_na_cidade: true
  # Quanto tempo a reunião fica aberta.
  minutos: 5
  # Quem chega a esta distância do ponto da reunião é informado.
  raio: 16
