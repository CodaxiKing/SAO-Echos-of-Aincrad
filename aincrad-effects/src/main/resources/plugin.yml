name: AincradEffects
version: '${version}'
main: com.aincrad.effects.AincradEffectsPlugin
api-version: '1.21'
description: Motor de efeitos visuais e sonoros do servidor, com resource pack único.
authors: [CodaxiKing]
# Ordem de carga da rede Aincrad (o Paper recusa dependências em círculo): Core, Effects, UI,
# RPG, Economy, Floors, Bosses, Items, Life, Reputation, Duels, Social, Skills, Quests, World,
# Admin. Um plugin só lista aqui os que vêm ANTES dele; os que vêm depois são achados em tempo
# de execução. O teste LoadOrderTest do aincrad-core confere.
softdepend: [PlaceholderAPI]

commands:
  efeito:
    description: Toca, lista e para efeitos; reenvia o resource pack.
    usage: /efeito <tocar|lista|parar|pack|reload>
    aliases: [efeitos, fx]

permissions:
  aincrad.effects.play:
    description: Tocar, listar e parar efeitos.
    default: op
  aincrad.effects.pack:
    description: Pedir o resource pack de novo.
    default: true
  aincrad.admin:
    description: Comandos de administração do Aincrad.
    default: op
