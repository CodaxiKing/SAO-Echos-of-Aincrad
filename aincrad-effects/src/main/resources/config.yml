# ============================================================
#  AincradEffects — configuração principal
# ============================================================

# Quem vê um efeito quando o YAML do efeito não diz: jogador | raio:<n> | mundo | servidor
publico_padrao: jogador

pack:
  # Formato do resource pack (1.21.11 = 75).
  formato: 75
  descricao: "Aincrad — pack do servidor"
  # Se definida, os jogadores baixam o pack desta URL (hospede lá o .zip gerado em pack/).
  url: ""
  obrigatorio: false
  mensagem: "<aqua>Este servidor usa um resource pack para imagens e efeitos."
  # Considera que todo jogador tem o pack (útil com o pack instalado direto no cliente).
  assumir_carregado: false
  servidor_embutido:
    # Servidor HTTP simples que entrega o pack (usado quando "url" está vazia).
    ativo: true
    porta: 8163
    # Endereço que os jogadores usam para baixar, ex.: http://123.45.67.89:8163
    # Vazio = automático: cada jogador baixa do mesmo endereço que digitou para entrar no
    # servidor, nesta porta. Nos dois casos a porta precisa estar aberta no host (num painel
    # de hospedagem, crie uma alocação de porta extra). Se o host não deixa abrir porta, hospede
    # o .zip fora e use "url" acima.
    endereco_publico: ""

limites:
  # Text Displays de efeitos visíveis ao mesmo tempo para um jogador.
  entidades_por_jogador: 40
  # Partículas enviadas a um jogador num único tick.
  particulas_por_jogador_por_tick: 600
  # Jogadores mais longe que isso da origem não recebem partículas, textos no mundo, fogos e sons.
  distancia_visao: 48
  # Efeitos tocando ao mesmo tempo com o mesmo jogador como alvo (os mais antigos param).
  efeitos_simultaneos_por_jogador: 8
