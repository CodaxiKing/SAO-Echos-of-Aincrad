# ============================================================
#  AincradEffects — efeitos de exemplo
# ============================================================
# Cada chave é um efeito. "passos" é a sequência; "em" é o segundo em que o passo começa.
# Tipos de passo: titulo, imagem, actionbar, bossbar, som, particulas, texto_mundo, fogos, pocao, menu.
# Textos usam MiniMessage, variáveis {jogador}, {nome}, {level}, {andar}, {item}... e a tag <img:id>.
# Veja o README para todos os campos.

# /efeito tocar teste @a — imagem, som, partículas, texto no mundo, fogos e BossBar.
teste:
  publico: jogador
  passos:
    - em: 0
      tipo: imagem
      imagem: teste
      subtitulo: "<gray>Olá, <aqua>{jogador}</aqua>! O motor de efeitos está funcionando."
      entrada: 0.3
      fica: 2.5
      saida: 0.7
    - em: 0
      tipo: som
      som: minecraft:entity.player.levelup
      tom: 1.2
    - em: 0.3
      tipo: particulas
      particula: END_ROD
      forma: espiral
      raio: 1.2
      altura: 2.5
      voltas: 3
      quantidade: 60
    - em: 0.5
      tipo: particulas
      particula: DUST
      cor: "#5BC8FF"
      tamanho: 1.4
      forma: circulo
      raio: 1.5
      quantidade: 40
      deslocamento: [0, 0.1, 0]
      repetir: 4
      intervalo: 0.25
    - em: 1
      tipo: texto_mundo
      texto: "<aqua><bold>{jogador}</bold></aqua>\n<gray>Lv. {level}"
      deslocamento: [0, 2.6, 0]
      escala: 0.6
      escala_final: 1.1
      subir: 0.6
      duracao: 2.5
    - em: 1.5
      tipo: fogos
      forma_fogo: BALL_LARGE
      cores: ["#5BC8FF", "#FFFFFF"]
      cores_fade: ["#1E3A5F"]
      quantidade: 3
      espalhar: 2
      deslocamento: [0, 3, 0]
    - em: 0
      tipo: bossbar
      texto: "<aqua>Efeito de teste"
      cor: BLUE
      progresso_inicial: 1
      progresso_final: 0
      duracao: 4

# Tocado pelo gatilho de entrar no servidor (triggers.yml).
boas_vindas:
  passos:
    - em: 0
      tipo: imagem
      imagem: bem_vindo
      subtitulo: "<gray>Link start, <aqua>{jogador}</aqua>."
      entrada: 0.5
      fica: 3
      saida: 1
    - em: 0
      tipo: som
      som: minecraft:block.amethyst_block.chime
      no_jogador: true
      tom: 0.8
    - em: 0.2
      tipo: particulas
      particula: TOTEM_OF_UNDYING
      forma: coluna
      raio: 0.6
      altura: 2.2
      quantidade: 40

# Tocado pelo gatilho de subir de nível ({nivel} vem do gatilho).
subir_nivel:
  passos:
    - em: 0
      tipo: actionbar
      texto: "<green><bold>Level up!</bold> <white>Nível {nivel}"
      duracao: 3
    - em: 0
      tipo: som
      som: minecraft:entity.player.levelup
      no_jogador: true
    - em: 0
      tipo: particulas
      particula: HAPPY_VILLAGER
      forma: circulo
      raio: 1
      quantidade: 24
      deslocamento: [0, 0.2, 0]

# Estilhaços azuis: usado pelo AincradUI na morte de jogadores e mobs.
aincrad_estilhacos:
  publico: raio:32
  passos:
    - em: 0
      tipo: particulas
      particula: BLOCK
      bloco: LIGHT_BLUE_STAINED_GLASS
      forma: ponto
      quantidade: 70
      espalhar: [0.3, 0.6, 0.3]
      velocidade: 0.15
      deslocamento: [0, 0.9, 0]
    - em: 0
      tipo: particulas
      particula: END_ROD
      forma: explosao
      quantidade: 24
      velocidade: 0.12
      deslocamento: [0, 0.9, 0]
    - em: 0
      tipo: particulas
      particula: DUST
      cor: "#82D2FF"
      tamanho: 1.3
      forma: ponto
      quantidade: 40
      espalhar: [0.35, 0.6, 0.35]
      deslocamento: [0, 0.9, 0]
    - em: 0
      tipo: som
      som: minecraft:block.glass.break
      categoria: PLAYER
      tom: 1.3

# Menu com fundo do pack. /efeito tocar menu_teste
menu_teste:
  passos:
    - em: 0
      tipo: menu
      titulo: "<dark_gray>Menu de efeito"
      fundo: fundo_menu
      linhas: 3
      itens:
        - slot: 11
          material: NETHER_STAR
          nome: "<aqua>Tocar o efeito de teste"
          lore: ["<gray>Clique para ver o efeito"]
          comando: "efeito tocar teste"
          fechar: true
        - slot: 15
          material: BARRIER
          nome: "<red>Fechar"
          fechar: true
