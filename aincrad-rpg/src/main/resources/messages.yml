# /aincrad spawn: marcar a área, os mobs e o level deles sem abrir o spawns.yml.
spawn:
  descricao: "Mobs por área: marcar, escolher os mobs e o level"
  uso: "<gray>Uso: <white>/aincrad spawn</white> (menu), <white>varinha</white>, <white>criar <nome> [exato]</white>, <white>mob <área> <mob> <level> [peso]</white>, <white>level|peso|nome|periodo <área> <mob> <valor></white>, <white>remover <área> [mob]</white>, <white>maximo <área> <n></white>, <white>ver <área></white>, <white>aqui</white>, <white>lista"
  uso_criar: "<gray>Uso: <white>/aincrad spawn criar <nome> [exato]</white> <gray>— marque antes os dois cantos com a varinha. Com <white>exato</white>, a altura é a dos dois cliques."
  uso_mob: "<gray>Uso: <white>/aincrad spawn mob <área> <ZOMBIE|mythic:Nome> <level> [peso]</white> <gray>— level: <white>3</white> ou <white>2-4"
  uso_campo: "<gray>Uso: <white>/aincrad spawn level <área> <mob> <3 ou 2-4></white>, <white>peso <área> <mob> <n></white>, <white>nome <área> <mob> <texto|nenhum></white>, <white>periodo <área> <mob> <dia|noite|sempre>"
  uso_maximo: "<gray>Uso: <white>/aincrad spawn maximo <área> <1 a 200>"
  varinha: "<green>Varinha entregue. <gray>Clique esquerdo num canto da área, direito no canto oposto, e depois <white>/aincrad spawn criar <nome></white>."
  nome_invalido: "<red>Nome inválido. Use letras minúsculas, números e _ (sem ponto)."
  sem_selecao: "<red>Marque os dois cantos da área com a varinha, no mesmo mundo. <gray>(<white>/aincrad spawn varinha</white>)"
  area_marcada: "<green>Área <white><regiao></white> marcada: <white><largura></white> × <white><comprimento></white> blocos, <white><altura></white> de altura."
  criada: "<green>A área <white><regiao></white> agora tem mobs. <gray>Ponha os mobs com <white>/aincrad spawn mob <regiao> <mob> <level></white> ou pelo menu <white>/aincrad spawn</white>."
  ja_existe: "<yellow>A área <white><regiao></white> já está na lista de mobs."
  sem_regiao: "<red>A área <white><regiao></white> não está na lista de mobs. <gray>Veja <white>/aincrad spawn lista</white>."
