  mob_invalido: "<red><white><mob></white> não é um mob do Minecraft. <gray>Para o MythicMobs, use <white>mythic:Nome</white>."
  mob_posto: "<green><white><mob></white> level <white><level></white> vai nascer em <white><regiao></white>."
  mob_tirado: "<yellow><white><mob></white> não nasce mais em <white><regiao></white>."
  mudou: "<green><regiao> · <white><mob></white>: <campo> = <white><valor>"
  maximo: "<green><white><regiao></white>: até <white><maximo></white> mobs vivos ao mesmo tempo."
