# ============================================================
#  AincradUI — configuração principal
# ============================================================

menu:
  # Modo de desenho padrão: "cursor" (ícones flutuando na frente do jogador)
  # ou "bau" (menu de inventário). Cada jogador pode trocar em Opções.
  # Quem não tem o resource pack carregado usa sempre o modo baú.
  modo_padrao: cursor
  gesto:
    # Agachar + clique esquerdo abre o menu.
    ativo: true
    # Só abre com a mão principal vazia.
    mao_vazia: true
  # Põe o ícone do menu nos quatro espaços de fabricação do inventário: o jogador aperta E e
  # clica no ícone para abrir o menu SAO. (A tecla E em si não pode ser trocada por um plugin:
  # o Minecraft abre o inventário sem avisar o servidor.) Enquanto isto está ligado, a
  # fabricação 2x2 do inventário fica ocupada; a bancada continua normal.
  botao_no_inventario: true
  # Distância (blocos) entre os olhos do jogador e o menu no modo cursor.
  distancia: 2.2
  # Multiplica o tamanho e o espaçamento de todos os ícones do modo cursor.
  escala: 1.0
  # Ajuste vertical do menu (blocos). Negativo desce.
  ajuste_y: -0.1
  # Fecha o menu quando o jogador leva dano.
  fechar_ao_levar_dano: true
  # Mostra o painel de perfil (silhueta com o equipamento) à esquerda da coluna de ícones.
  painel_perfil: true
  # Convite de party e desafio de duelo abrem a janela de aceitar/recusar na frente do jogador
  # (só se ele não está com um menu aberto). false deixa só o aviso no chat.
  janela_de_convite: true

hud:
  ativo: true
  # "barras": barra de vida com o nome, barra azul de energia, XP e level (precisa do pack).
  # "sao": a moldura do anime com a barra em fatias.
  estilo: barras
  barras:
    # Distância (pixels de interface) do centro da tela até a borda esquerda da HUD.
    # 232 encosta no canto em 1080p com a interface em escala 4 (480 px de largura).
    deslocamento_x: 232
    # Usa as artes do pack: a moldura de vida do anime com a barra em fatias, as barras pequenas
    # na party e no alvo, placas claras nos avisos e os ícones de skill nas recargas.
    # false desenha tudo com retângulos e letras.
    artes: true
    # Troca a hotbar do Minecraft por bolinhas.
    hotbar_redonda: true
    # Esconde corações, fome, armadura e a barra de XP do Minecraft (a HUD já mostra).
    esconder_vanilla: true
  # O que vem a seguir só aparece na HUD em barras (estilo: barras), para quem tem o pack.
  # Alvo: nome e vida do mob em que o jogador bateu ou que ele mira, no alto da tela. O nome sai
  # na cor do cursor (rosa claro = bem mais fraco que o jogador; carmesim = bem mais forte), pelo
  # level do AincradRPG.
  alvo:
    ativo: true
    # Até que distância o olhar pega um alvo.
    distancia: 20
    # Alvos com esta vida máxima ou mais são chefes: a vida aparece em várias barras.
    chefe_vida: 300
    chefe_barras: 4
  # Hora do servidor e data (a estação do AincradWorld, se instalado) no canto de cima.
  relogio: true
  # Faixa com N, S, L, O no alto da tela, e um ponto para cada membro da party.
  bussola: true
  # Recarga das Sword Skills equipadas, no canto de baixo (precisa do AincradSkills).
  recargas: true
  # Avisos que aparecem no canto e somem: item recebido, level, quest concluída, conquista.
  avisos:
    ativo: true
    itens: true
    segundos: 4
  # Faixas do anime no meio da tela, por um instante: "WARNING" quando a vida fica crítica,
  # "Immortal Object" quando o golpe é barrado numa zona segura, o losango do duelo no começo dele.
  faixas:
    ativo: true
    segundos: 2
  # De quantos em quantos ticks a barra é atualizada (20 ticks = 1 s).
  intervalo_ticks: 4
  # Segmentos da barra para quem está SEM o pack (com o pack, são as 20 fatias da arte).
  segmentos: 20
  # Distância (pixels de interface) do centro da tela até o início da moldura.
  # Aumente para encostar mais à esquerda. Depende da escala de interface do cliente.
  deslocamento_x: 200
  # Posições dentro da moldura (ui/hud/frame.png), em pixels de fonte. Só mude se trocar a arte.
  moldura:
    nome_x: 9
    nome_largura: 44
    barra_x: 57
    numeros_x: 62
  # Barras menores dos membros da party, embaixo da barra principal (precisa de um plugin de
  # party, como o AincradSocial).
  party:
    maximo: 7
    # Quantos pixels as barras dos membros ficam para dentro em relação à moldura principal.
    recuo: 8
  # Abaixo deste valor a barra fica amarela.
  limite_amarelo: 0.5
  # Abaixo deste valor a barra fica vermelha, pisca e toca o alerta.
  limite_vermelho: 0.25
  # Período da piscada (ticks).
  piscar_ticks: 8
  # Intervalo mínimo entre dois alertas de vida crítica (segundos).
  alerta_intervalo_segundos: 3
  mostrar_numeros: true
  texto_level: "LV:"

# Telas desenhadas direto na tela, com cursor (a loja do AincradEconomy e outras).
# O jogador fica parado, o mouse move o cursor, clique esquerdo aciona e agachar fecha.
tela_plana:
  ativo: true
  # Pixels de interface que o cursor anda por grau de giro da câmera.
  sensibilidade: 6.0

morte:
  # Estilhaços azuis quando um jogador morre.
  estilhacos_jogador: true
  # Mobs também se desfazem em estilhaços.
  estilhacos_mobs: true
  # Quanto tempo a imagem "You are dead" fica na tela.
  titulo_segundos: 4
  # Efeito do AincradEffects usado no lugar das partículas embutidas (quando instalado).
  efeito_estilhacos: "aincrad_estilhacos"

logout:
  # Como no anime: o botão de logout "sumiu" e só mostra uma mensagem.
  modo_death_game: false

pack:
  # Com o AincradEffects instalado, a pasta resourcepack/ é registrada no pack único dele
  # e as opções abaixo (url, servidor_embutido) são ignoradas.
  # Sem o AincradEffects, o AincradUI gera plugins/AincradUI/aincrad-ui-pack.zip.
  formato: 75
  descricao: "Aincrad UI"
  # Considera que todo jogador tem o pack (útil para testar com o pack instalado no cliente).
  assumir_carregado: false
  # Deixa a barra branca da BossBar transparente (a HUD de vida usa a cor branca).
  # Outros plugins devem usar outra cor de BossBar.
  ocultar_barra_branca: true
  # URL pública do .zip, se você hospedar o pack em outro lugar.
  url: ""
  obrigatorio: false
  servidor_embutido:
    # Servidor HTTP simples para entregar o pack sem hospedagem externa.
    ativo: false
    porta: 8164
    # Endereço que os jogadores usam para baixar, ex.: http://123.45.67.89:8164
    endereco_publico: ""

# Sons do namespace aincrad. "arquivo" é o .ogg em
# resourcepack/assets/aincrad/sounds/<arquivo>.ogg. Enquanto o .ogg não existir,
# o pack aponta para o som "reserva" do Minecraft (quem está sem pack também ouve a reserva).
sons:
  abrir:    { evento: ui.open,     arquivo: ui/open,     reserva: minecraft:block.note_block.chime,   volume: 1.0, tom: 1.2 }
  mover:    { evento: ui.move,     arquivo: ui/move,     reserva: minecraft:block.note_block.hat,     volume: 0.6, tom: 1.6 }
  confirmar: { evento: ui.confirm,  arquivo: ui/confirm,  reserva: minecraft:entity.experience_orb.pickup, volume: 0.8, tom: 1.4 }
  voltar:   { evento: ui.back,     arquivo: ui/back,     reserva: minecraft:block.note_block.bass,    volume: 0.8, tom: 1.0 }
  fechar:   { evento: ui.close,    arquivo: ui/close,    reserva: minecraft:block.note_block.chime,   volume: 0.8, tom: 0.7 }
  critico:  { evento: ui.critical, arquivo: ui/critical, reserva: minecraft:block.note_block.bit,     volume: 1.0, tom: 0.6 }
  morte:    { evento: ui.death,    arquivo: ui/death,    reserva: minecraft:block.glass.break,        volume: 1.0, tom: 0.8 }
