      festins: "Festins"
      cozinha_de_campanha: "Cozinha de campanha"
  gourmet:
    nome: "Gourmet"
    exclusivo: "Pratos individuais de rank A e S"
    especializacoes:
      carnes: "Carnes"
      doces_e_bebidas: "Doces e bebidas"
  provisionador:
    nome: "Provisionador"
    exclusivo: "Comida que não estraga e buffs longos"
    especializacoes:
      conservas: "Conservas"
      racoes_de_viagem: "Rações de viagem"

