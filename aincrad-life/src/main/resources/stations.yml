# ============================================================
#  Bancadas das profissões. /aincrad estacao criar <tipo> põe uma virada para você.
#
#  modelo:            id do modelo no resource pack (pasta resourcepack/ deste plugin). Os modelos
#                     que vêm no plugin são PROVISÓRIOS (o próprio bloco do Minecraft): troque os
#                     arquivos em assets/aincrad/models/station/ pelos seus, do Blockbench.
#                     Se existir "<modelo>_active", ele é usado durante o trabalho.
#  escala:            tamanho do modelo (1.0 = um bloco).
#  clique:            [largura, altura] da área de clique, em blocos.
#  bloco_provisorio:  bloco que aparece para quem está sem o pack (e no Bedrock), e que vira a
#                     própria bancada quando os modelos estão desligados.
#  ancoras:           posições em blocos a partir do centro da base, com a frente no +Z:
#                       holograma — o painel de progresso
#                       encaixes  — onde os materiais flutuam
#                       batidas   — os pontos onde as marcas de batida aparecem
#                     Mude aqui para ajustar ao modelo final, sem mexer em código (/aincrad reload).
# ============================================================
estacoes:
  forge_anvil:
    nome: "Bigorna de forja"
    profissao: ferreiro
    modelo: "aincrad:station/forge_anvil"
    escala: 1.0
    clique: [1.05, 1.05]
    bloco_provisorio: ANVIL
    ancoras:
      holograma: [0, 2.3, 0]
      encaixes: [[-0.9, 1.6, 0], [-0.45, 1.85, 0], [0, 1.95, 0], [0.45, 1.85, 0], [0.9, 1.6, 0]]
      batidas: [[-0.3, 1.15, 0], [0, 1.15, 0], [0.3, 1.15, 0]]
