# ============================================================
#  Level dos mobs — ANDARES 1 a 4
#  Pacote de conteúdo: copie para plugins/AincradRPG/mobs.yml.
#
#  O level sai da zona onde o mob nasce. Zona = região do AincradCore
#  (/aincrad regiao criar <nome>); se o mob está em várias, vale a menor.
#  Sem zona: o mundo; sem mundo: "padrao".
#  Os mobs do spawns.yml já trazem o level de cada linha; as zonas daqui
#  valem para o resto (mobs postos à mão, por outro plugin ou pelo Minecraft).
# ============================================================
apenas_hostis: true

padrao: { min: 1, max: 3 }

mundos:
  world: { min: 1, max: 5 }

zonas:
  campos_oeste: { min: 1, max: 3 }
  floresta_horunka: { min: 3, max: 5 }
  planicie_tolbana: { min: 4, max: 6 }
  labirinto_andar1: { min: 6, max: 8 }
  labirinto_andar1_topo: { min: 8, max: 9 }
  planalto_urbus: { min: 10, max: 12 }
  pradaria_marome: { min: 12, max: 14 }
  desfiladeiro_taran: { min: 14, max: 16 }
  labirinto_andar2: { min: 16, max: 18 }
  labirinto_andar2_topo: { min: 18, max: 19 }
  floresta_da_nevoa: { min: 20, max: 22 }
  bosque_elfico: { min: 22, max: 24 }
  caverna_das_aranhas: { min: 24, max: 26 }
  labirinto_andar3: { min: 26, max: 28 }
  labirinto_andar3_topo: { min: 28, max: 29 }
  canais_de_rovia: { min: 30, max: 32 }
  floresta_dos_ursos: { min: 32, max: 34 }
  lago_da_caldeira: { min: 34, max: 36 }
  labirinto_andar4: { min: 36, max: 38 }
  labirinto_andar4_topo: { min: 38, max: 39 }

escala:
  vida_por_level: 0.12   # +12% de vida por level acima do 1
  dano_por_level: 0.08   # +8% de dano por level acima do 1

xp:
  base_por_level: 6      # XP = base × level do mob
  diferenca_livre: 3     # sem redução até este tanto de levels acima do mob
  perda_por_level: 0.15  # depois disso, -15% por level a mais
  minimo: 0.1            # nunca abaixo de 10%

nome: "<gray>[<yellow>Lv.<level></yellow>]</gray> <white><mob>"
nome_visivel: true
