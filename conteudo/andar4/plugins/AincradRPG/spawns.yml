      - mob: PIG
        id: javali_frenetico
        nome: "<white>Frenzy Boar"
        peso: 6
        level: "1-2"
        drops:
          - { item: PORKCHOP, chance: 0.8, quantidade: "1-2" }
          - { item: LEATHER, chance: 0.25 }
      - mob: WOLF
        id: lobo_jovem
        nome: "<white>Lobo Jovem"
        agressivo: true
        peso: 1
        level: 2
        periodo: dia
        drops:
          - { item: BONE, chance: 0.5 }
          - { item: LEATHER, chance: 0.3 }
      - mob: WOLF
        id: lobo_terrivel
        nome: "<white>Dire Wolf"
        agressivo: true
        peso: 3
        level: "2-3"
        periodo: noite
