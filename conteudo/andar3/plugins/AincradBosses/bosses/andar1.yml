# ============================================================
#  Chefe do ANDAR 1 — Illfang the Kobold Lord
#  Pacote de conteúdo: copie para plugins/AincradBosses/bosses/andar1.yml.
#
#  Como no anime: quatro barras de vida. Nas três primeiras ele luta de machado e escudo
#  e chama os Ruin Kobold Sentinels a cada barra; na última larga os dois e puxa a nodachi.
#  Pensado para um grupo de 6 a 8 jogadores de level 8 a 10.
#
#  Montar a sala: veja conteudo/andar1/README.md.
# ============================================================
illfang:
  andar: 1
  nome: "Illfang the Kobold Lord"
  level: 10
  mob: WITHER_SKELETON
  vida: 800
  dano: 8
  armadura: 6
  velocidade: 0.24
  resistencia_empurrao: 0.8
  escala: 1.6
  equipamento:
    mao: IRON_AXE
    mao_secundaria: SHIELD
    cabeca: GOLDEN_HELMET
    peito: LEATHER_CHESTPLATE
  # Chefe parado e invulnerável enquanto a barra de vida enche.
  intro_segundos: 5
  # 0 = sem limite.
  tempo_limite_segundos: 900
  # Na sala deste chefe nenhum cristal do AincradItems funciona.
  anti_cristal: true
  # Depois da primeira vitória, volta só como desafio a cada X horas (0 = não volta).
  reaparece_horas: 6
  fases:
    - vida: 100
      nome: "Machado e escudo"
      habilidades:
        - { tipo: lacaios, recarga: 40, mob: ZOMBIE, quantidade: 3, level: 8, nome: "Ruin Kobold Sentinel" }
        - { tipo: area, recarga: 12, dano: 8, raio: 4, aviso_ticks: 30 }
    - vida: 75
      nome: "Segunda barra"
      mensagem: "<red>Mais Sentinelas saltam das paredes!"
      habilidades:
        - { tipo: lacaios, recarga: 35, mob: ZOMBIE, quantidade: 3, level: 8, nome: "Ruin Kobold Sentinel" }
        - { tipo: area, recarga: 11, dano: 9, raio: 4, aviso_ticks: 28 }
        - { tipo: investida, recarga: 16, dano: 9, raio: 3 }
    - vida: 50
      nome: "Enfurecido"
      mensagem: "<red><chefe> ruge e avança!"
      dano_x: 1.1
      habilidades:
        - { tipo: lacaios, recarga: 35, mob: ZOMBIE, quantidade: 3, level: 9, nome: "Ruin Kobold Sentinel" }
        - { tipo: area, recarga: 10, dano: 9, raio: 4, aviso_ticks: 25 }
        - { tipo: investida, recarga: 14, dano: 10, raio: 3 }
    - vida: 25
      nome: "Nodachi"
      mensagem: "<dark_red><chefe> larga o machado e o escudo e puxa uma espada enorme!"
      equipamento:
        mao: NETHERITE_SWORD
        mao_secundaria: AIR
      dano_x: 1.3
      velocidade_x: 1.4
      habilidades:
        - { tipo: investida, recarga: 9, dano: 12, raio: 3 }
        - { tipo: salto, recarga: 12, dano: 12, raio: 4 }
        - { tipo: furia, recarga: 25, segundos: 8, multiplicador: 1.5, nome: "<dark_red>Os olhos de <chefe> brilham em vermelho!" }
  recompensas:
    # Dano mínimo (em % da vida do chefe) para contar como participante.
    dano_minimo_pct: 5
    # Para cada participante.
    xp: 800
    col: 500
    # Só para quem deu o golpe final: o Coat of Midnight.
    last_attack: "rpg:casaco_da_meia_noite:lendario"
    # Divididos em rodízio entre os participantes, começando por quem causou mais dano.
    itens:
      - { item: IRON_INGOT, quantidade: 12 }
      - { item: GOLDEN_APPLE, quantidade: 4 }
      - { item: "rpg:anneal_blade:raro", quantidade: 1 }
      - { item: "rpg:cota_de_malha:raro", quantidade: 1 }
      - { item: "rpg:machado_kobold:incomum", quantidade: 1 }
