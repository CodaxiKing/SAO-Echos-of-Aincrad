# ============================================================
#  Itens — ANDARES 1 a 3
#  Pacote de conteúdo: copie para plugins/AincradRPG/items.yml.
#
#  Cada bônus tem uma faixa [mín, máx]; o valor sorteado é multiplicado pela raridade
#  (config.yml → raridades).
#  Bônus: dano, vida, armadura, resistencia, velocidade_ataque (%), velocidade (%)
#  Bônus de combate (em %): critico, dano_critico, roubo_vida, esquiva, aparar
#  slot: MAINHAND, OFFHAND, HEAD, CHEST, LEGS, FEET
#  drop (opcional): chance por abate de mob com level na faixa.
#
#  O nome escolhe o tipo de arma das Sword Skills (config.yml do AincradSkills):
#  "Adaga", "Florete", "Lança", "Montante" e "Machado" no nome; o resto das espadas é "espada".
# ============================================================
