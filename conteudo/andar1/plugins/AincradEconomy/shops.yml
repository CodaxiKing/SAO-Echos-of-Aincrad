# ============================================================
#  Lojas de NPC — ANDAR 1
#  Pacote de conteúdo: copie para plugins/AincradEconomy/shops.yml.
#
#  Ligue cada loja a um bloco ou NPC olhando para ele:
#    /aincrad loja criar <id>   (bloco)     /aincrad loja npc <id>   (entidade)
#  item: material do Minecraft, ou "rpg:<id>" / "rpg:<id>:<raridade>" (items.yml do AincradRPG)
#  compra: preço para o jogador comprar (sem = não vende)
#  venda: quanto a loja paga ao jogador (sem = não compra)
#  quantidade: quantos vêm por compra
# ============================================================
lojas:

  # ---------------------------------------------------------- Cidade do Início
  mercador_inicio:
