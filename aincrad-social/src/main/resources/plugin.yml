name: AincradSocial
version: '${version}'
main: com.aincrad.social.AincradSocialPlugin
api-version: '1.21'
description: Amigos, party, guilda, duelos e mensagens no estilo SAO (integra com o menu do AincradUI).
authors: [CodaxiKing]
softdepend: [AincradUI, Vault, AincradEconomy, AincradFloors, AincradQuests, AincradRPG, AincradReputation]

commands:
  amigo:
    description: Amigos — lista, adicionar, aceitar, recusar, remover, pedidos.
    usage: /amigo [lista|adicionar|aceitar|recusar|remover|pedidos] [jogador]
    aliases: [amigos, friend, friends]
    permission: aincrad.social.use
  party:
    description: Party — convidar, aceitar, recusar, sair, expulsar, líder, desfazer, lista, chat.
    usage: /party [convidar|aceitar|recusar|sair|expulsar|lider|desfazer|lista|chat] [jogador|mensagem]
    aliases: [grupo]
    permission: aincrad.social.use
  mensagem:
    description: Manda uma mensagem para um amigo (fica na caixa de entrada dele).
    usage: /mensagem <jogador> <texto>
    aliases: [carta]
    permission: aincrad.social.use
  guilda:
    description: Guilda — criar, info, convidar, cargos, cofre, tesouro, casa, uniforme, aliança, ranking.
    usage: /guilda [criar|info|lista|convidar|aceitar|recusar|candidatar|candidaturas|sair|expulsar|promover|rebaixar|lider|cofre|tesouro|casa|uniforme|alianca|ranking|desfazer|config]
    aliases: [guild, guildas]
    permission: aincrad.social.use
  g:
    description: Chat da guilda.
    usage: /g <mensagem>
    permission: aincrad.social.use
  ga:
    description: Chat das guildas aliadas.
    usage: /ga <mensagem>
    permission: aincrad.social.use
  duelo:
    description: Duelo — desafiar, aceitar, recusar, desistir.
    usage: /duelo <jogador> [primeiro_golpe|metade|total] | aceitar [jogador] | recusar [jogador] | desistir
    aliases: [duel, duelar]
    permission: aincrad.social.use
  caixa:
    description: Mostra sua caixa de entrada.
    usage: /caixa [ler <n>|apagar <n>]
    aliases: [inbox]
    permission: aincrad.social.use

permissions:
  aincrad.social.use:
    description: Usar amigos, party e mensagens.
    default: true
