# ============================================================
#  AincradSocial — amigos, party e mensagens
# ============================================================

dados:
  # Onde guardar amigos, mensagens e guildas:
  #   auto    - no banco do AincradCore quando ele está no servidor; senão, em arquivos
  #   banco   - no banco do AincradCore (os mesmos dados em todos os servidores da rede)
  #   arquivo - dados.yml e guildas.yml nesta pasta (um servidor só)
  # Na primeira vez com o banco vazio, dados.yml e guildas.yml são levados para ele e renomeados.
  onde: auto

amigos:
  maximo: 100
  # Avisa os amigos quando alguém entra ou sai do servidor.
  avisar_entrada: true

party:
  # No anime uma party tem até 8 jogadores.
  tamanho_maximo: 8
  convite_expira_segundos: 60
  # Membros da mesma party podem se machucar?
  fogo_amigo: false
  # Mensagens no chat que começam com este prefixo vão só para a party. Vazio desliga.
  chat_prefixo: "@"
  xp:
    # Divide o XP dos mobs (AincradRPG) entre os membros que estão por perto.
    dividir: true
    # Distância, em blocos, para contar como "por perto" (vale também para os drops).
    raio: 32
    # A cada membro a mais, o XP total cresce isto (0.1 = +10%), antes de dividir.
    bonus_por_membro: 0.1
  # De quem são os itens que os mobs soltam: livre (quem pegar), por_vez (rodízio) ou lider.
  drops: livre

mensagens:
  # Só dá para mandar mensagem para amigos (como no anime).
  so_amigos: true
  # Quantas mensagens cabem na caixa de entrada; as mais antigas saem.
  caixa_maxima: 50

menu:
  # Na lista "Convidar" / "Adicionar", quem está a até este raio aparece primeiro.
  raio_perto: 32
  # Quanto tempo o jogador tem para digitar no chat (mensagem ou nome).
  tempo_digitar_segundos: 60
