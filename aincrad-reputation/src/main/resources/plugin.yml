name: AincradReputation
version: '${version}'
main: com.aincrad.reputation.AincradReputationPlugin
api-version: '1.21'
description: Conquistas, títulos, cor do cursor (player killers), prisão e PvP por andar.
authors: [CodaxiKing]
depend: [AincradCore]
# Ordem de carga da rede Aincrad (o Paper recusa dependências em círculo): Core, Effects, UI,
# RPG, Economy, Floors, Bosses, Items, Life, Reputation, Duels, Social, Skills, Quests, World,
# Admin. Um plugin só lista aqui os que vêm ANTES dele; os que vêm depois são achados em tempo
# de execução. O teste LoadOrderTest do aincrad-core confere.
softdepend: [AincradFloors, AincradBosses, AincradItems, AincradLife, AincradEconomy, LuckPerms]

# Os comandos de jogador (/titulos, /conquistas, /reputacao) são registrados pelo plugin ao ligar.

permissions:
  aincrad.admin:
    description: Comandos de administração do Aincrad (/aincrad prisao, reputacao, titulo, conquista).
    default: op
  aincrad.reputation.bypass:
    description: Não muda de cor de cursor e entra nas cidades com qualquer cor.
    default: false
