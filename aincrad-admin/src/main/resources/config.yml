# ============================================================
#  AincradAdmin — ferramentas do dono
# ============================================================
registro:
  # Guarda as ações de administração por tantos dias. 0 = para sempre.
  guardar_dias: 90
  # Linhas por página em /aincrad log.
  por_pagina: 10
  # Também escreve cada ação no console do servidor.
  console: true
  # Formato da data em /aincrad log (padrão do Java: dd, MM, yyyy, HH, mm).
  formato_data: "dd/MM/yyyy HH:mm"

backup:
  # Faz um backup por dia, na primeira vez que o servidor está ligado depois desta hora.
  diario: true
  hora: "04:00"
  # Apaga os backups com mais de tantos dias. 0 = guarda para sempre.
  guardar_dias: 14

# Ranking em site: uma página e os mesmos dados em JSON (/api/ranking). Só leitura.
# A porta precisa estar liberada na hospedagem. Ela fica só aqui: o plugin não a mostra no console.
site:
  ativo: false
  endereco: "0.0.0.0"
  porta: 8085
  titulo: "Aincrad — Ranking"
  # De quanto em quanto tempo o ranking é relido do banco.
  atualizar_segundos: 60
