  titulo: "<gold>Aincrad <gray>· servidor <white><servidor></white> · banco <white><banco>"
  plugin: "<green>● <white><plugin></white> <gray><versao>"
  plugin_desligado: "<red>● <white><plugin></white> <gray><versao> <red>desligado (veja o erro no console)"
  plugin_falta: "<dark_gray>○ <gray><plugin> <dark_gray>não instalado"
  integracao: "<green>+ <white><nome></white> <gray>ligado <dark_gray>(usam: <usam>)"
  integracao_falta: "<dark_gray>- <gray><nome> ausente <dark_gray>(usariam: <usam>)"
  backup: "<gray>Último backup: <white><nome></white> <dark_gray>(<qtd> guardados)"
  backup_nenhum: "<yellow>Nenhum backup feito ainda."
  pack: "<gray>Resource pack: <white><arquivo></white>, <white><tamanho>"
  pack_nenhum: "<gray>Resource pack: nenhum .zip gerado."
