log:
  descricao: "Registro das ações de administração"
  uso: "<gray>Uso: <white>/aincrad log [jogador|*] [tipo|*] [página]</white>. <gray>Tipo é o plugin (<white>floors</white>) ou a ação (<white>andar</white>, <white>andar.liberar</white>)."
  pagina_invalida: "<red>Página inválida: <white><valor></white>."
  titulo: "<gold>Registro de admin <gray>· página <white><pagina></white> <dark_gray>(<filtro>)"
  linha: "<dark_gray><data> <aqua><autor></aqua> <dark_gray>[<plugin>] <yellow><acao></yellow> <gray><detalhe>"
  vazio: "<gray>Nada no registro para esse filtro."
  proxima: "<gray>Próxima página: <white>/aincrad log <jogador> <tipo> <pagina>"
  filtro_tudo: "tudo"
  filtro_jogador: "jogador <jogador>"
  filtro_tipo: "tipo <tipo>"
  erro: "<red>Não foi possível ler o registro. Veja o console."

backup:
  descricao: "Backup dos plugins Aincrad: fazer, listar e restaurar"
  uso: "<gray>Uso: <white>/aincrad backup agora</white>, <white>listar</white>, <white>restaurar <data>"
  comecou: "<gray>Fazendo o backup..."
  feito: "<green>Backup <white><nome></white> feito: <white><arquivos></white> arquivos, <white><tamanho></white>, com o banco."
  feito_sem_banco: "<green>Backup <white><nome></white> feito: <white><arquivos></white> arquivos, <white><tamanho></white>. <yellow>O banco é MySQL e não entra: faça o backup dele pelo próprio MySQL."
  falhou: "<red>O backup falhou: <white><erro></white>. <gray>Veja o console."
  nenhum: "<gray>Ainda não há backups."
  lista_titulo: "<gold>Backups <gray>(<qtd>), do mais novo para o mais velho"
  lista_linha: "<white><nome></white> <dark_gray>· <gray><arquivos> arquivos, <tamanho> <dark_gray>· <gray>banco: <banco> <dark_gray>· <gray><motivo>"
  desconhecido: "<red>Não há backup de <white><data></white>. <gray>Veja em <white>/aincrad backup listar</white>."
  com_jogadores: "<red>Só dá para restaurar com o servidor vazio. <gray>Jogadores online: <white><qtd></white>."
  confirme: "<yellow>Restaurar o backup <white><nome></white> (<arquivos> arquivos, banco: <banco>)? <gray>As configs e os dados de agora voltam a ser os desse dia, e o servidor <white>desliga</white> para aplicar. Um backup do estado atual é feito antes. Repita com <white>confirmar</white> no fim em até 1 minuto."
  aviso_mysql: "<yellow>O banco deste servidor é MySQL: só os arquivos voltam. O banco precisa ser restaurado pelo próprio MySQL."
  antes: "<gray>Guardando o estado atual antes de restaurar..."
  desligando: "<gold>Restauração de <white><nome></white> marcada. O estado atual ficou em <white><atual></white>. <gray>O servidor vai desligar; ao ligar de novo, os dados já são os do backup."

status:
