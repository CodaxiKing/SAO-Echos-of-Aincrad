name: AincradEconomy
version: '${version}'
main: com.aincrad.economy.AincradEconomyPlugin
api-version: '1.21'
description: Col (moeda da rede), lojas de NPC, /pagar, troca segura, leilão e casas do Aincrad.
authors: [CodaxiKing]
depend: [AincradCore]
softdepend: [Vault, AincradRPG, AincradUI]
# Liga antes dos plugins que procuram a economia ao ligar.
loadbefore: [AincradSocial]

commands:
  col:
    description: Mostra seu saldo de Col (ou o de outro jogador).
    usage: /col [jogador]
    aliases: [saldo, money, balance]
    permission: aincrad.economy.use
  pagar:
    description: Paga Col para outro jogador.
    usage: /pagar <jogador> <quantidade>
    aliases: [pay]
    permission: aincrad.economy.use
  trocar:
    description: Troca segura de itens e Col com outro jogador.
    usage: /trocar <jogador>|aceitar|recusar
    aliases: [trade, troca]
    permission: aincrad.economy.use
  leilao:
    description: Leilão — ver anúncios, anunciar o item da mão, caixa de retirada.
    usage: /leilao [vender <preço> [horas]|retirar]
    aliases: [leiloes, ah, auction]
    permission: aincrad.economy.use
  casa:
    description: Sua casa — comprar, ir, convidar, remover, definir chegada, vender.
    usage: /casa [info|comprar|ir|convidar|remover|definirspawn|imposto|vender] [jogador]
    aliases: [home]
    permission: aincrad.economy.use
  casas:
    description: O corretor — casas de cada andar, com visita às que estão à venda.
    usage: /casas
    aliases: [corretor, imobiliaria]
    permission: aincrad.economy.use

permissions:
  aincrad.economy.use:
    description: /col, /pagar, /trocar, /leilao e /casa.
    default: true
  aincrad.economy.admin:
    description: /aincrad col|loja|casa, ver o saldo dos outros e mexer em qualquer casa.
    default: op
