# ============================================================
#  AincradEconomy — configuração
#  Lojas: shops.yml
# ============================================================

# Col de quem entra pela primeira vez na rede.
saldo_inicial: 100

# Col que cai ao matar mobs (direto no saldo, com aviso na action bar).
mobs:
  ativo: true
  col_por_level: 3        # Col = level do mob × este valor
  variacao: 0.25          # ±25% de sorte
  chance: 1.0             # chance de dar Col por abate (0 a 1)
  # Mob sem level do AincradRPG (RPG desligado ou mob sem level) conta como este level; 0 = não dá Col.
  level_sem_rpg: 1

pagar:
  minimo: 1
  taxa: 0.0               # fração que some no /pagar (0.05 = 5%)

troca:
  distancia_maxima: 16    # blocos; 0 = qualquer distância (mesmo mundo)
  expira_pedido: 60       # segundos para aceitar o pedido
  passo_col: 100          # quanto cada clique no botão de Col soma ou tira (shift = ×10)
  espera_confirmar: 2     # segundos sem poder confirmar depois de alguém mudar a oferta

leilao:
  preco_minimo: 1
  horas_padrao: 24
  horas_maximo: 72
  max_anuncios: 5         # anúncios ativos por jogador
  taxa_anuncio: 0.0       # fração do preço paga ao anunciar
  taxa_venda: 0.05        # fração do preço que o vendedor perde ao vender

casas:
  max_por_jogador: 1
  max_convidados: 10
  reembolso: 0.5          # fração do preço devolvida no /casa vender
  # Quando o dono vende, é despejado ou some, a casa volta a ser como era ao ser criada
  # (blocos, baús e molduras). O modelo é guardado no /aincrad casa criar; para guardar de novo
  # depois de reformar a casa: /aincrad casa modelo <nome>.
  restaurar_ao_devolver: true
  # A casa de quem não entra há tantos dias volta ao mercado, sem reembolso. 0 = nunca.
  inatividade_dias: 0
  # Imposto: é o que faz casas voltarem ao mercado. A cada período o dono paga uma fração do
  # preço da casa. É cobrado sozinho quando ele está online; dá para adiantar com
  # /casa imposto pagar <períodos>. Passada a tolerância sem pagar, a casa é retomada.
  imposto:
    fracao: 0.02          # 2% do preço por período. 0 = sem imposto
    a_cada_dias: 7
    tolerancia_dias: 7
    max_adiantado: 8      # até quantos períodos à frente dá para deixar pago
  # O corretor (/casas): visita às casas à venda. 0 segundos = sem visita, só a lista.
  visita:
    segundos: 30
  # Casas com vista: vendidas por leilão (/aincrad casa leilao <nome> <lance mínimo> <horas>).
  leilao:
    incremento: 0.05      # cada lance precisa superar o anterior em 5%
    prorrogar_minutos: 5  # um lance no fim do prazo estica o leilão por este tempo

# Nome da moeda nas mensagens e no Vault.
moeda:
  singular: "Col"
  plural: "Col"

rede:
  # Canal para trocar o jogador de servidor (/casa ir numa casa de outro servidor da rede).
  canal: "BungeeCord"
